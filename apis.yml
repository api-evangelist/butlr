  - url: https://graphql-docs.butlr.io/graphql/
    type: APIReference
  - url: https://graphql-docs.butlr.io/graphql/
    type: GraphQL
  description: The Butlr GraphQL API manages spatial assets and their configuration
    across the organization hierarchy - sites, buildings, floors, rooms, zones, hives,
    and sensors - plus asset tags and self-service webhook subscriptions. It supports
    querying and mutating (create/update/delete) resources with fine-grained field
    selection and filtering, and is the control plane for the occupancy platform.
- aid: butlr:butlr-reporting-api
  name: Butlr Reporting API
  tags:
  - Occupancy
  - Traffic
  - Presence Time
  - Heatmap
  - Statistics
  - Time Series
  - Historical
  - Floors
  - Rooms
  - Zones
  humanURL: https://docs.butlr.io/historical-occupancy/reporting-api-overview
  baseURL: https://api.butlr.io/api/v3/reporting
  properties:
  - url: https://docs.butlr.io/historical-occupancy/reporting-api-overview
    type: Documentation
  - url: https://docs.butlr.io/historical-occupancy/faqs
    type: APIReference
  description: The Butlr Reporting API is a RESTful, time-series occupancy API for
    historical space-utilization analysis. A POST query against a windowing/filter
    body returns aggregated floor, room, and zone occupancy, entryway traffic,
    presence time, per-interval statistics, and heatmaps with configurable windows
    (1m/1h/1d), aggregation functions (mean/max/sum/median), timezones, and tag-based
    grouping.
