name: Butlr
description: 'Butlr is an AI platform for privacy-first, heat-based (thermal) occupancy
  sensing that turns anonymous people-sensing into real-time space-utilization insight
  for workplaces, senior living, higher education, retail, and smart buildings. Its
  camera-free thermal sensors capture no personally identifiable information while
  powering occupancy, traffic, presence-time, and heatmap analytics. Butlr exposes
  an API-first platform: a GraphQL asset-management API for sites, buildings, floors,
  rooms, zones, hives, and sensors; a RESTful Reporting API (v3) for historical
  time-series occupancy; real-time webhooks for detections, traffic, and occupancy
  events; and an official Model Context Protocol (MCP) server for agent access. The
  company reports 30,000+ deployed sensors generating a billion data points daily
  across 100M+ square feet in 22 countries.'
